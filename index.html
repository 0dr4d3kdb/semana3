<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="logo">
            <img src="logo.png" alt="logo">
            <h1>Blooming</h1>
        </div>
        <nav id="menuhead">
            <a href="#">Plants</a>
            <a href="#">Shop</a>
            <a href="#">Sale</a>
            <a href="#">Video</a>
            <a href="#">About</a>
        </nav>
        <div id="contact">
            <button>Contact</button>
        </div>
    </header>
    <div id="seccion1">
        <div id="titulo">
            <h2>Plant Collection</h1>
            <h3>Celebrate the love in your life with a gift that grows on.</h2>
        </div>
        <div id="plantas">
            <div class="planta">
                <button>+</button>
            </div>
            <div class="planta">
                <button>+</button>
            </div>
            <div class="planta">
                <button>+</button>
            </div>
        </div>
        <button id="buynow">Buy now</button>
    </div>
    <div id="seccion2">
        <p>Add new plant</p>
        <div id="formulario">
            <form action="">
                <input id="nombre" type="text" placeholder="Nombre de la planta">
                <input id="especie" type="text" placeholder="Especie">
                <input id="precio" type="text" placeholder="Valor">
                <input id="cantidad" type="text" placeholder="Cantidad">
                <select name="frutal" id="frutalselect">
                    <option value="seleccionar">Frutal (Sí/No)</option>
                    <option value="frutalsi">Sí</option>
                    <option value="frutalno">No</option>
                </select>
                <select name="veneno" id="venenoselect">
                    <option value="seleccionar">Venenosa (Sí/No)</option>
                    <option value="frutalsi">Sí</option>
                    <option value="frutalno">No</option>
                </select>
                <p id="error">&nbsp;</p>
                <button id="agregar">Agregar</button>
            </form>
            <div id="fotoplanta"></div>
        </div>
    </div>
    <footer>
        <div id="left"></div>
        <div id="right"></div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
